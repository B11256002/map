<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧交通導航系統 (多時相旗艦版)</title>
    
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Noto Sans TC', sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; z-index: 1; }

        /* UI 面板設定 */
        .control-panel { position: absolute; top: 20px; left: 20px; z-index: 1000; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 20px; border-radius: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); width: 300px; transition: transform 0.4s ease, opacity 0.4s ease; }
        h2 { margin-top: 0; font-size: 1.2rem; color: #333; }
        .instruction { font-size: 0.9rem; color: #666; margin-bottom: 15px; font-weight: bold; }

        .btn { width: 100%; padding: 10px; margin-top: 8px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #1d4ed8; }
        .btn-clear { background: #ef4444; }
        .btn-clear:hover { background: #b91c1c; }
        .btn-mode { background: #10b981; margin-bottom: 15px; }
        .btn-mode:hover { background: #059669; }
        .btn-locate { background: #f8fafc; color: #334155; border: 1px solid #cbd5e1; margin-bottom: 10px; }
        .btn-simulate { background: #8b5cf6; margin-top: 15px; display: none; }

        /* 導航儀表板 */
        .nav-dashboard { position: absolute; z-index: 1001; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; text-align: center; color: white; transition: opacity 0.4s ease, top 0.4s ease, bottom 0.4s ease; opacity: 0; pointer-events: none; }
        .nav-top { top: -100px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); padding: 15px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .nav-top h1 { margin: 0; font-size: 1.8rem; color: #4ade80; }
        .nav-top p { margin: 5px 0 0 0; color: #cbd5e1; }
        .nav-bottom { bottom: -100px; background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.2); color: #333; display: flex; justify-content: space-between; align-items: center; }
        .nav-bottom .stats h2 { margin: 0; font-size: 1.5rem; color: #2563eb; }
        .btn-deviate { background: #f59e0b; color: white; padding: 10px 15px; border-radius:8px; border:none; cursor:pointer; font-weight:bold;}
        .btn-recenter { position: absolute; bottom: 120px; right: 20px; z-index: 1000; background: #2563eb; color: white; padding: 12px 20px; border-radius: 30px; border: none; display: none; }

        body.is-navigating .control-panel { transform: translateX(-150%); opacity: 0; pointer-events: none; }
        body.is-navigating .nav-dashboard { opacity: 1; pointer-events: auto; }
        body.is-navigating .nav-top { top: 20px; }
        body.is-navigating .nav-bottom { bottom: 20px; }

        /* --- 🌟 全新：多時相微型電子看板 UI --- */
        .signboard {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px);
            border-radius: 8px; border: 1px solid #334155;
            color: white; padding: 10px; font-size: 12px;
            min-width: 140px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .signboard-title { font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #fbbf24; border-bottom: 1px solid #475569; padding-bottom: 5px; }
        .signboard-phase { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .sign-green { color: #4ade80; font-weight: bold; text-shadow: 0 0 5px #4ade80; }
        .sign-red { color: #f87171; }
        .sign-yellow { color: #facc15; font-weight: bold; text-shadow: 0 0 8px #facc15; }

        /* 動態新增表單 */
        .add-form input { width: 90%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
        .phase-input-group { display: flex; gap: 5px; margin-bottom: 5px; }
        .phase-input-group input { margin: 0; width: 50%; }
        .btn-add-phase { background: #64748b; margin-top: 5px; }
        .btn-save { background: #10b981; }

        .nav-arrow-container { width: 40px; height: 40px; transition: transform 0.2s linear; }
        .nav-arrow { width: 100%; height: 100%; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%233b82f6" stroke="white" stroke-width="2"><path d="M12 2L22 20L12 17L2 20L12 2Z"/></svg>'); background-size: contain; background-position: center; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5)); }
        .maplibregl-popup-content { padding: 15px; border-radius: 10px; }

        /* --- 🌟 終極版防遮擋浮動看板 --- */
/* 1. 容器：將尺寸歸零，讓 MapLibre 的座標系統完美精準打在 0,0 上 */
.traffic-marker-wrapper {
    position: relative;
    width: 0px; 
    height: 0px;
}

/* 2. 小圓點：絕對置中於路口座標 */
.intersection-dot {
    position: absolute;
    top: -7px;  /* 寬高 14 的一半，往上往左回拉，達成完美置中 */
    left: -7px;
    width: 14px;
    height: 14px;
    background-color: #2563eb; /* 質感深藍色 */
    border: 2px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(0,0,0,0.6);
    z-index: 2;
}

/* 3. 看板本體：固定向右上方推移，完全不擋路 */
.signboard-floating {
    position: absolute;
    bottom: 12px;  /* 從圓點往上推 */
    left: 12px;    /* 從圓點往右推 */
    background: rgba(15, 23, 42, 0.9); /* 加深一點背景，字體更清楚 */
    backdrop-filter: blur(8px);
    border-radius: 10px;
    border: 1px solid #475569;
    color: white;
    padding: 12px;
    font-size: 13px;
    min-width: 140px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    z-index: 1;
    pointer-events: none; /* 避免滑鼠干擾地圖拖曳 */
}

/* 4. 看板尾巴：精準指向圓點的箭頭 */
.signboard-floating::after {
    content: '';
    position: absolute;
    bottom: -8px; 
    left: -2px;   /* 調整尾巴位置，指向左下角的圓點 */
    border-width: 12px 16px 0 0;
    border-style: solid;
    border-color: rgba(15, 23, 42, 0.9) transparent transparent transparent;
}

    </style>
</head>
<body>

    <div class="control-panel" id="main-panel">
        <h2>智慧交通系統 (多時相)</h2>
        <button class="btn btn-mode" id="mode-btn">切換至 🚦「新增號誌」模式</button>
        <button class="btn btn-locate" id="locate-btn">📍 定位我的位置</button>
        <p class="instruction" id="status-text">🚗 請點擊地圖設定「目的地」</p>
        
        <div id="nav-controls">
            <button class="btn" id="plan-btn" disabled>規劃路線</button>
            <button class="btn btn-clear" id="clear-btn">清除</button>
        </div>
        <button class="btn btn-simulate" id="simulate-btn">🚗 模擬開車</button>
    </div>

            <!-- 🌟 開發者專用：強制方向控制器 -->
        <div style="margin-top:15px; padding:10px; background:#fde047; border-radius:8px; font-size:14px; color:#854d0e; font-weight:bold;">
            🛠️ 測試專用：強制車頭方向<br>
            <select id="force-heading" style="width:100%; margin-top:5px; padding:5px;">
                <option value="auto">📍 自動抓取 (預設)</option>
                <option value="0">⬆️ 往北開 (0°)</option>
                <option value="90">➡️ 往東開 (90°)</option>
                <option value="180">⬇️ 往南開 (180°)</option>
                <option value="270">⬅️ 往西開 (270°)</option>
            </select>
        </div>

    <!-- 導航介面 -->
    <div class="nav-dashboard nav-top" id="nav-top"><h1 id="nav-instruction">↑ 沿著藍色路線前進</h1><p>請小心駕駛並觀察路口號誌</p></div>
    <div class="nav-dashboard nav-bottom" id="nav-bottom">
        <div class="stats"><h2 id="nav-eta">-- 分鐘</h2><p id="nav-distance">剩餘 -- 公里</p></div>
        <div style="display:flex; gap:10px;">
            <button class="btn-deviate" id="deviate-btn">🚨 偏離測試</button>
            <button class="btn btn-clear" id="exit-nav-btn" style="width:auto; margin:0;">退出</button>
        </div>
    </div>
    <button id="recenter-btn" class="btn-recenter">📍 回到導航視角</button>

    <div id="map"></div>

    <script>

        // --- 🚗 生成並獲取匿名設備 ID ---
function getOrCreateDeviceId() {
    // 嘗試從瀏覽器的 LocalStorage 讀取現有的 ID
    let deviceId = localStorage.getItem('nav_device_id');
    
    // 如果沒有（代表是第一次打開網頁的新使用者）
    if (!deviceId) {
        // 使用瀏覽器內建加密 API 產生標準 UUID (例如: "36b8f84d-df4e-4d49-b662-bcde71a8764f")
        deviceId = crypto.randomUUID(); 
        // 存入 LocalStorage，下次重整網頁就不會變了
        localStorage.setItem('nav_device_id', deviceId);
    }
    return deviceId;
}

const myDeviceId = getOrCreateDeviceId();
console.log("我的匿名車牌是：", myDeviceId);

        const map = new maplibregl.Map({
            container: 'map', style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
            center: [121.5654, 25.0330], zoom: 14, pitch: 0, bearing: 0 
        });
        map.addControl(new maplibregl.NavigationControl());

        let isAddMode = false; let endPoint = null; let endMarker = null; let trafficLightMarkers = {}; 
        let userMarker = null; let userLngLat = null; let currentHeading = 0; 
        let isNavigating = false; let isCameraLocked = true; let routeGeoJSON = null; let isRerouting = false;
        let simulationInterval = null; let simState = { active: false, currentDistance: 0 };

        const modeBtn = document.getElementById('mode-btn'); const statusText = document.getElementById('status-text');
        const planBtn = document.getElementById('plan-btn'); const clearBtn = document.getElementById('clear-btn');
        const simulateBtn = document.getElementById('simulate-btn'); const recenterBtn = document.getElementById('recenter-btn');

        modeBtn.addEventListener('click', () => {
            isAddMode = !isAddMode;
            modeBtn.innerText = isAddMode ? "切換至 🚗「導航」模式" : "切換至 🚦「新增號誌」模式";
            modeBtn.style.background = isAddMode ? "#eab308" : "#10b981";
            statusText.innerText = isAddMode ? "🚦 新增模式：點擊地圖新增號誌" : "🚗 請點擊地圖設定「目的地」";
        });

        function calculateBearing(lng1, lat1, lng2, lat2) {
            const toRad = Math.PI / 180; const toDeg = 180 / Math.PI;
            const dLng = (lng2 - lng1) * toRad;
            const y = Math.sin(dLng) * Math.cos(lat2 * toRad);
            const x = Math.cos(lat1 * toRad) * Math.sin(lat2 * toRad) - Math.sin(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.cos(dLng);
            return ((Math.atan2(y, x) * toDeg) + 360) % 360;
        }

        function updateUserLocationUI(lng, lat, heading) {
            userLngLat = [lng, lat]; currentHeading = heading;
            if (!userMarker) {
                const el = document.createElement('div');
                el.innerHTML = `<div class="nav-arrow-container" id="arrow-container" style="transform: rotate(${heading}deg)"><div class="nav-arrow"></div></div>`;
                userMarker = new maplibregl.Marker({ element: el }).setLngLat(userLngLat).addTo(map);
                if(!isNavigating) map.jumpTo({ center: userLngLat, zoom: 16 });
            } else {
                userMarker.setLngLat(userLngLat);
                const arrowContainer = document.getElementById('arrow-container');
                if (arrowContainer) arrowContainer.style.transform = `rotate(${heading}deg)`;
            }

            if (isNavigating && isCameraLocked) map.easeTo({ center: userLngLat, bearing: heading, pitch: 60, zoom: 18, duration: 1000, easing: t => t });
            else if (!isNavigating && isCameraLocked) map.easeTo({ center: userLngLat, duration: 1000 });

            if (isNavigating && routeGeoJSON && !isRerouting) checkRouteProgress();
        }

        function checkRouteProgress() {
            try {
                const userPt = turf.point(userLngLat); const routeLine = turf.lineString(routeGeoJSON.coordinates);
                const distanceToLine = turf.pointToLineDistance(userPt, routeLine, { units: 'meters' });
                if (distanceToLine > 30) { triggerReroute(); return; }

                const snappedPt = turf.nearestPointOnLine(routeLine, userPt);
                const endPt = turf.point(routeGeoJSON.coordinates[routeGeoJSON.coordinates.length - 1]);
                const slicedLine = turf.lineSlice(snappedPt, endPt, routeLine);
                if (map.getSource('route')) map.getSource('route').setData(slicedLine);
            } catch (e) {}
        }

        async function triggerReroute() {
            if (isRerouting) return; isRerouting = true;
            document.getElementById('nav-instruction').innerText = "⚠️ 偏離路線，重算中..."; document.getElementById('nav-instruction').style.color = "#ef4444";
            try {
                const res = await fetch(`/route?start=${userLngLat[0]},${userLngLat[1]}&end=${endPoint[0]},${endPoint[1]}`);
                const data = await res.json();
                routeGeoJSON = data.routes[0].geometry; map.getSource('route').setData(routeGeoJSON);
                document.getElementById('nav-eta').innerText = `${Math.ceil(data.routes[0].duration / 60)} 分鐘`;
                document.getElementById('nav-distance').innerText = `剩餘 ${(data.routes[0].distance / 1000).toFixed(1)} 公里`;
                document.getElementById('nav-instruction').innerText = "↑ 沿著新路線前進"; document.getElementById('nav-instruction').style.color = "#4ade80";
                if (simState.active) startSimulation(routeGeoJSON);
            } catch (error) {} finally { setTimeout(() => { isRerouting = false; }, 2000); }
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    if (simState.active) return;
                    let heading = currentHeading;
                    if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) heading = pos.coords.heading;
                    else if (userLngLat && turf.distance(turf.point(userLngLat), turf.point([pos.coords.longitude, pos.coords.latitude]), {units: 'meters'}) > 2) heading = calculateBearing(userLngLat[0], userLngLat[1], pos.coords.longitude, pos.coords.latitude);
                    updateUserLocationUI(pos.coords.longitude, pos.coords.latitude, heading);
                },
                (err) => {}, { enableHighAccuracy: true }
            );
        }

        map.on('dragstart', () => { isCameraLocked = false; if (isNavigating) recenterBtn.style.display = "block"; });
        recenterBtn.addEventListener('click', () => { isCameraLocked = true; recenterBtn.style.display = "none"; updateUserLocationUI(userLngLat[0], userLngLat[1], currentHeading); });
        document.getElementById('locate-btn').addEventListener('click', () => { isCameraLocked = true; if (userLngLat && !isNavigating) map.flyTo({ center: userLngLat, zoom: 16 }); });

        let popup = new maplibregl.Popup({ closeOnClick: false });
        
        // --- 🌟 全新：動態表單邏輯 ---
        window.addPhaseInput = function() {
            const container = document.getElementById('phases-container');
            const div = document.createElement('div'); div.className = 'phase-input-group';
            div.innerHTML = `<input type="text" class="p-dir" placeholder="方向 (例:左轉)"><input type="number" class="p-time" placeholder="綠燈秒數">`;
            container.appendChild(div);
        }

        map.on('click', function(e) {
            const lng = e.lngLat.lng; const lat = e.lngLat.lat;
            if (isAddMode) {
                const formHtml = `
                    <div class="add-form">
                        <h4 style="margin-top:0; color:black;">🚦 新增多時相路口</h4>
                        <input type="text" id="new-name" placeholder="路口名稱 (例:中正路口)">
                        <div id="phases-container">
                            <div class="phase-input-group"><input type="text" class="p-dir" value="南北向直行"><input type="number" class="p-time" placeholder="綠燈秒數"></div>
                            <div class="phase-input-group"><input type="text" class="p-dir" value="東西向直行"><input type="number" class="p-time" placeholder="綠燈秒數"></div>
                        </div>
                        <button class="btn btn-add-phase" onclick="addPhaseInput()">➕ 新增一個方向</button>
                        <button class="btn btn-save" onclick="submitLight(${lat}, ${lng})">儲存寫入資料庫</button>
                    </div>
                `;
                popup.setLngLat([lng, lat]).setHTML(formHtml).addTo(map);
            } else {
                if (isNavigating) return;
                if (!userLngLat) return alert("等待定位中...");
                endPoint = [lng, lat];
                if (!endMarker) endMarker = new maplibregl.Marker({ color: "#ef4444" }).setLngLat(endPoint).addTo(map);
                else endMarker.setLngLat(endPoint);
                statusText.innerText = "✅ 目的地已設定，可以規劃路線了！"; planBtn.disabled = false;
            }
        });

        window.submitLight = async function(lat, lng) {
            const name = document.getElementById('new-name').value;
            if (!name) return alert("請輸入路口名稱！");
            
            const phases = [];
            const dirs = document.querySelectorAll('.p-dir');
            const times = document.querySelectorAll('.p-time');
            for(let i=0; i<dirs.length; i++) {
                if(dirs[i].value && times[i].value) {
                    phases.push({ direction: dirs[i].value, green_time: parseInt(times[i].value) });
                }
            }
            if(phases.length < 2) return alert("一個路口至少需要填寫兩個方向的秒數！");

            try {
                const res = await fetch('/add-light', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, lat, lng, phases }) });
                if (res.ok) { alert("✅ 成功新增多時相路口！"); popup.remove(); fetchTrafficLights(); }
            } catch (error) { alert("發生錯誤！"); }
        }

        // --- 路線規劃與導航控制保留原本完美邏輯 ---
        planBtn.addEventListener('click', async () => {
            if (!userLngLat || !endPoint) return;
            if (planBtn.innerText === "開始導航") {
                isNavigating = true; isCameraLocked = true; document.body.classList.add('is-navigating');
                document.getElementById('nav-instruction').innerText = "↑ 沿著藍色路線前進"; document.getElementById('nav-instruction').style.color = "#4ade80";
                updateUserLocationUI(userLngLat[0], userLngLat[1], currentHeading); return;
            }
            planBtn.innerText = "規劃中..."; planBtn.disabled = true;
            try {
                const res = await fetch(`/route?start=${userLngLat[0]},${userLngLat[1]}&end=${endPoint[0]},${endPoint[1]}`); const data = await res.json();
                routeGeoJSON = data.routes[0].geometry; 
                if (map.getSource('route')) map.getSource('route').setData(routeGeoJSON);
                else {
                    map.addSource('route', { type: 'geojson', data: routeGeoJSON });
                    map.addLayer({ id: 'route-layer', type: 'line', source: 'route', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#3b82f6', 'line-width': 8, 'line-opacity': 0.8 } });
                }
                const bounds = new maplibregl.LngLatBounds(userLngLat, userLngLat); bounds.extend(endPoint); map.fitBounds(bounds, { padding: 50 });
                document.getElementById('nav-eta').innerText = `${Math.ceil(data.routes[0].duration / 60)} 分鐘`; document.getElementById('nav-distance').innerText = `剩餘 ${(data.routes[0].distance / 1000).toFixed(1)} 公里`;
                statusText.innerText = "🚗 路線已生成！"; planBtn.innerText = "開始導航"; planBtn.style.background = "#8b5cf6"; simulateBtn.style.display = "block";
            } catch (error) {} finally { planBtn.disabled = false; }
        });

        document.getElementById('exit-nav-btn').addEventListener('click', () => {
            isNavigating = false; isCameraLocked = true; document.body.classList.remove('is-navigating');
            map.flyTo({ center: userLngLat, pitch: 0, bearing: 0, zoom: 15, duration: 1500 });
            if (simulationInterval) { clearInterval(simulationInterval); simState.active = false; } clearRoute();
        });

        clearBtn.addEventListener('click', clearRoute);
        function clearRoute() {
            if (endMarker) endMarker.remove(); endMarker = null; endPoint = null; routeGeoJSON = null;
            if (map.getLayer('route-layer')) map.removeLayer('route-layer'); if (map.getSource('route')) map.removeSource('route');
            planBtn.disabled = true; planBtn.innerText = "規劃路線"; planBtn.style.background = "#2563eb"; simulateBtn.style.display = "none"; statusText.innerText = "🚗 請點擊地圖設定「目的地」";
        }

        simulateBtn.addEventListener('click', () => { if (!routeGeoJSON) return; isNavigating = true; isCameraLocked = true; document.body.classList.add('is-navigating'); startSimulation(routeGeoJSON); });
        function startSimulation(geoJSON) {
            simState.active = true; simState.currentDistance = 0;
            const line = turf.lineString(geoJSON.coordinates); const totalDist = turf.length(line, { units: 'meters' });
            if (simulationInterval) clearInterval(simulationInterval);
            simulationInterval = setInterval(() => {
                if (isRerouting) return;
                simState.currentDistance += 15;
                if (simState.currentDistance >= totalDist) { clearInterval(simulationInterval); alert("🎉 已抵達目的地！"); document.getElementById('exit-nav-btn').click(); return; }
                const along = turf.along(line, simState.currentDistance, { units: 'meters' }); const nextLngLat = along.geometry.coordinates;
                updateUserLocationUI(nextLngLat[0], nextLngLat[1], turf.bearing(turf.point(userLngLat), turf.point(nextLngLat)));
                document.getElementById('nav-distance').innerText = `剩餘 ${((totalDist - simState.currentDistance) / 1000).toFixed(1)} 公里`;
            }, 1000);
        }
        document.getElementById('deviate-btn').addEventListener('click', () => { if (isNavigating) updateUserLocationUI(userLngLat[0] + 0.001, userLngLat[1], currentHeading); });

        // --- 🌟 完美效能版：前端本地運算倒數 ---
const YELLOW_TIME = 3; // 統一黃燈秒數
let rawLightsData = []; // 儲存從資料庫抓來的一次性原始資料

// 1. 只負責「抓取資料」（只需執行一次，或每隔幾分鐘執行一次更新路口）
// --- 🌟 完美效能版：前端本地運算倒數 ---
async function fetchTrafficLights() {
    try {
        // 🌟 關鍵修正：加上 ?t=時間戳 與 cache: 'no-store'，強制每次都去資料庫拿最新鮮的資料！
        const url = '/traffic-lights?t=' + new Date().getTime();
        const response = await fetch(url, { cache: 'no-store' }); 
        
        rawLightsData = await response.json();
        
        // 抓完資料後，馬上觸發畫面更新
        updateTrafficLightsUI();
    } catch (error) { 
        console.error("抓取號誌資料失敗:", error); 
    }
}

// 2. 負責「計算秒數與更新畫面」（每秒在本地執行，完全不耗費網路流量）
function updateTrafficLightsUI() {
    const now = new Date(); // 取得用戶本地目前時間

    rawLightsData.forEach(light => {
        try {
            // 解析資料庫的開始時間 (UTC)
            const startTime = new Date(light.cycle_start);
            const elapsedSec = (now.getTime() - startTime.getTime()) / 1000;
            const phases = light.phases;
            if (!phases || phases.length === 0) return;

            // 計算總週期
            let totalTime = 0;
            phases.forEach(p => totalTime += (p.green_time + YELLOW_TIME));
            if (totalTime <= 0) return;

            // 計算目前在週期內的秒數
            let currentInCycle = Math.max(0, elapsedSec % totalTime);
            
            let accumulated = 0;
            let activeIdx = 0;

            // 找出目前亮燈的時相
            for (let i = 0; i < phases.length; i++) {
                let phaseDur = phases[i].green_time + YELLOW_TIME;
                if (currentInCycle < accumulated + phaseDur) {
                    activeIdx = i;
                    break;
                }
                accumulated += phaseDur;
            }

            let timeInActivePhase = currentInCycle - accumulated;
            let activeGreen = phases[activeIdx].green_time;

            let activeStatus = timeInActivePhase < activeGreen ? "green" : "yellow";
            let activeRem = activeStatus === "green" 
                ? activeGreen - timeInActivePhase 
                : (activeGreen + YELLOW_TIME) - timeInActivePhase;

                        // ==========================================
            // 產生 HTML UI (包含防遮擋的浮動面板設計)
            // ==========================================
            let html = `
            <div class="traffic-marker-wrapper">
                <div class="intersection-dot"></div>
                <div class="signboard-floating">
                    <div class="signboard-title">📍 ${light.name}</div>
            `;
            
            phases.forEach((p, i) => {
                let status, remain, colorClass, dot; // 👈 就是這行！剛剛不小心被刪掉了
                
                if (i === activeIdx) {
                    status = activeStatus;
                    remain = Math.ceil(activeRem);
                } else {
                    status = "red";
                    let waitTime = (activeGreen + YELLOW_TIME) - timeInActivePhase;
                    let currWalk = (activeIdx + 1) % phases.length;
                    while (currWalk !== i) {
                        waitTime += phases[currWalk].green_time + YELLOW_TIME;
                        currWalk = (currWalk + 1) % phases.length;
                    }
                    remain = Math.ceil(waitTime);
                }

                if (status === 'green') { colorClass = 'sign-green'; dot = '🟢'; } 
                else if (status === 'yellow') { colorClass = 'sign-yellow'; dot = '🟡'; } 
                else { colorClass = 'sign-red'; dot = '🔴'; }
                
                html += `<div class="signboard-phase"><span>${p.direction}</span><span class="${colorClass}">${dot} ${remain}s</span></div>`;
            });
            
            // 補上 Wrapper 結尾標籤
            html += `</div></div>`;
            // ==========================================

            // 更新地圖上的 Marker
            if (trafficLightMarkers[light.name]) {
                trafficLightMarkers[light.name].getElement().innerHTML = html;
            } else {
                const el = document.createElement('div'); 
                el.innerHTML = html;
                trafficLightMarkers[light.name] = new maplibregl.Marker({ element: el })
                    .setLngLat([light.lng, light.lat])
                    .addTo(map);
            }
        } catch (e) {
            console.error(`計算 ${light.name} 發生錯誤:`, e);
        }
    });
}

// 3. 啟動機制
fetchTrafficLights(); // 網頁載入時抓一次資料庫
setInterval(updateTrafficLightsUI, 100); // 💡 每 0.1 秒刷新一次畫面（因為是本地計算，不怕流量，倒數會超滑順！）
setInterval(fetchTrafficLights, 60000); // 💡 每 1 分鐘才去後端問看看有沒有人新增新的紅綠燈

// --- 🛠️ 開發者測試專用：按「滑鼠右鍵」瞬間移動車子 ---
map.on('contextmenu', (e) => {
    // 如果正在自動模擬導航，就不允許手動干擾
    if (simState.active) return; 

    const lng = e.lngLat.lng;
    const lat = e.lngLat.lat;

    // 1. 強制更新使用者的座標到滑鼠右鍵點擊的地方
    updateUserLocationUI(lng, lat, currentHeading);
    
    // 2. 為了避免真實 GPS 一直把你拉回原地，我們暫時印出提示
    console.log(`🚗 車輛已手動瞬移至: ${lng.toFixed(5)}, ${lat.toFixed(5)}`);
});

// --- 🛰️ 遙測上報系統 (Telemetry) ---
let currentApproachingLight = null; // 記錄目前靠近哪個紅綠燈
let lastEventSent = null; // 防止重複瘋狂發送同一個狀態

// 1. 建立打 API 的函式
// 1. 建立打 API 的函式
async function sendTelemetry(lightName, event) {
    if (lastEventSent === event && currentApproachingLight === lightName) return; 
    
    try {
        // 🌟 獲取下拉選單的值
        const forceHeadingValue = document.getElementById('force-heading').value;
        
        // 如果有強制設定方向，就用強制設定的；否則才用算出來的 currentHeading
        let finalHeading = (forceHeadingValue !== "auto") 
            ? forceHeadingValue 
            : Math.round(currentHeading).toString();

        await fetch('/upload-telemetry', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                device_id: myDeviceId,    
                light_name: lightName,
                direction: finalHeading,  // 👈 已經修正為 finalHeading
                event: event            
            })
        });
        
        // 👈 這裡的 console.log 也修正為 finalHeading 了！
        console.log(`📤 已上報: ${lightName} - 角度:${finalHeading}° - ${event}`);
        
        lastEventSent = event;
        currentApproachingLight = lightName;

        // 🌟 關鍵解法：上報完立刻重新抓取後端的最新紅綠燈時間！
        fetchTrafficLights(); 
        
    } catch (e) {
        console.error("上報失敗", e);
    }
}

// 2. 核心雷達偵測邏輯 (每秒檢查一次)
setInterval(() => {
    if (!userLngLat || rawLightsData.length === 0) return;

    let userPt = turf.point(userLngLat);
    let nearestLight = null;
    let minDistance = Infinity;

    // 找出離車子最近的紅綠燈
    rawLightsData.forEach(light => {
        let lightPt = turf.point([light.lng, light.lat]);
        let dist = turf.distance(userPt, lightPt, { units: 'meters' });
        if (dist < minDistance) {
            minDistance = dist;
            nearestLight = light;
        }
    });

    // 邏輯判斷
    if (nearestLight && minDistance <= 30) {
        // 【狀況 A】在路口 30 公尺內
        
        // 取得目前的車速 (這裡用模擬狀態來判斷，若無移動視為速度 0)
        // 為了測試方便，我們先預設如果你沒有在「導航模擬移動中」，就是停著的
        let isMoving = simState.active || isNavigating; 
        
        if (!isMoving) {
            // 車子停下來了 -> 傳送 stop
            sendTelemetry(nearestLight.name, "stop");
        }
    } 
    else if (currentApproachingLight && minDistance > 30) {
        // 【狀況 B】原本靠近路口，現在駛離超過 30 公尺 -> 代表穿越過去了！
        sendTelemetry(currentApproachingLight, "pass");
        
        // 清除狀態，準備迎接下一個路口
        currentApproachingLight = null; 
        lastEventSent = null;
    }

}, 1000);

    </script>
